services:
  - type: web
    name: ai-business-solution-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app
    envVars:
      - key: USE_FREE_ALTERNATIVES
        value: true
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
